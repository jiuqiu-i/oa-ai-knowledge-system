<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style id="theme-vars">
:root {
  --oak-background: #FDFBF7;
  --oak-foreground: #2A261F;
  --oak-card: #FFFFFF;
  --oak-card-foreground: #2A261F;
  --oak-popover: #FFFFFF;
  --oak-popover-foreground: #2A261F;
  --oak-primary: #E58A2E;
  --oak-primary-foreground: #FFFFFF;
  --oak-muted: #F7F4EF;
  --oak-muted-foreground: #6E665B;
  --oak-border: #E8E2D9;
  --oak-input: #E8E2D9;
  --oak-ring: #E58A2E;

  --oak-radius-small: 4px;
  --oak-radius-medium: 8px;
  --oak-radius-large: 12px;

  --oak-surface: #FFFFFF;
  --oak-surface-2: #F7F4EF;
  --oak-ink: #2A261F;
  --oak-ink-2: #6E665B;
  --oak-ink-3: #9F968A;
  --oak-line: #E8E2D9;

  --oak-state-success: #34A853;
  --oak-state-warning: #F5B800;
  --oak-state-error: #EA4335;
  --oak-state-info: #2E90FA;

  --oak-shadow-1: 0 1px 2px rgba(42, 38, 31, .05), 0 1px 1px rgba(42, 38, 31, .03);
  --oak-shadow-2: 0 8px 24px -8px rgba(42, 38, 31, .14);
  --oak-shadow-3: 0 24px 60px -20px rgba(42, 38, 31, .22);

  --oak-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --oak-font-mono: ui-monospace, SFMono-Regular, "SF Mono", "Fira Code", "Noto Sans Mono", monospace;
}

.dark {
  --oak-background: #161410;
  --oak-foreground: #F5F1EA;
  --oak-card: #1E1A14;
  --oak-card-foreground: #F5F1EA;
  --oak-popover: #1E1A14;
  --oak-popover-foreground: #F5F1EA;
  --oak-primary: #F2A24D;
  --oak-primary-foreground: #2A261F;
  --oak-muted: #2A261F;
  --oak-muted-foreground: #A7A096;
  --oak-border: #3A342C;
  --oak-input: #3A342C;
  --oak-ring: #F2A24D;

  --oak-surface: #1E1A14;
  --oak-surface-2: #2A261F;
  --oak-ink: #F5F1EA;
  --oak-ink-2: #A7A096;
  --oak-ink-3: #7A7369;
  --oak-line: #3A342C;

  --oak-shadow-1: 0 1px 2px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .08);
  --oak-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, .35);
  --oak-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, .50);
}

.oak-h1 {
  font-family: var(--oak-font-sans);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.18;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--oak-ink);
}

.oak-h2 {
  font-family: var(--oak-font-sans);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--oak-ink);
}

.oak-h3 {
  font-family: var(--oak-font-sans);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  color: var(--oak-ink);
}

.oak-body {
  font-family: var(--oak-font-sans);
  font-size: 15px;
  line-height: 1.65;
  color: var(--oak-ink-2);
}

.oak-body-large {
  font-family: var(--oak-font-sans);
  font-size: 17px;
  line-height: 1.6;
  color: var(--oak-ink-2);
}

.oak-caption {
  font-family: var(--oak-font-sans);
  font-size: 13px;
  line-height: 1.5;
  color: var(--oak-ink-3);
}

.oak-mono {
  font-family: var(--oak-font-mono);
  font-size: 13px;
  line-height: 1.5;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--oak-background);
    --color-foreground: var(--oak-foreground);
    --color-card: var(--oak-card);
    --color-card-foreground: var(--oak-card-foreground);
    --color-popover: var(--oak-popover);
    --color-popover-foreground: var(--oak-popover-foreground);
    --color-primary: var(--oak-primary);
    --color-primary-foreground: var(--oak-primary-foreground);
    --color-muted: var(--oak-muted);
    --color-muted-foreground: var(--oak-muted-foreground);
    --color-border: var(--oak-border);
    --color-input: var(--oak-input);
    --color-ring: var(--oak-ring);
    --radius-sm: var(--oak-radius-small);
    --radius-md: var(--oak-radius-medium);
    --radius-lg: var(--oak-radius-large);
  }
  @layer base {
    body { background: var(--oak-background); color: var(--oak-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--oak-background); }
      .text-background { color: var(--oak-background); }
      .border-background { border-color: var(--oak-background); }
      .ring-background { --tw-ring-color: var(--oak-background); }
      .bg-foreground { background-color: var(--oak-foreground); }
      .text-foreground { color: var(--oak-foreground); }
      .border-foreground { border-color: var(--oak-foreground); }
      .ring-foreground { --tw-ring-color: var(--oak-foreground); }
      .bg-card { background-color: var(--oak-card); }
      .text-card { color: var(--oak-card); }
      .border-card { border-color: var(--oak-card); }
      .ring-card { --tw-ring-color: var(--oak-card); }
      .bg-card-foreground { background-color: var(--oak-card-foreground); }
      .text-card-foreground { color: var(--oak-card-foreground); }
      .border-card-foreground { border-color: var(--oak-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--oak-card-foreground); }
      .bg-popover { background-color: var(--oak-popover); }
      .text-popover { color: var(--oak-popover); }
      .border-popover { border-color: var(--oak-popover); }
      .ring-popover { --tw-ring-color: var(--oak-popover); }
      .bg-popover-foreground { background-color: var(--oak-popover-foreground); }
      .text-popover-foreground { color: var(--oak-popover-foreground); }
      .border-popover-foreground { border-color: var(--oak-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--oak-popover-foreground); }
      .bg-primary { background-color: var(--oak-primary); }
      .text-primary { color: var(--oak-primary); }
      .border-primary { border-color: var(--oak-primary); }
      .ring-primary { --tw-ring-color: var(--oak-primary); }
      .bg-primary-foreground { background-color: var(--oak-primary-foreground); }
      .text-primary-foreground { color: var(--oak-primary-foreground); }
      .border-primary-foreground { border-color: var(--oak-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--oak-primary-foreground); }
      .bg-muted { background-color: var(--oak-muted); }
      .text-muted { color: var(--oak-muted); }
      .border-muted { border-color: var(--oak-muted); }
      .ring-muted { --tw-ring-color: var(--oak-muted); }
      .bg-muted-foreground { background-color: var(--oak-muted-foreground); }
      .text-muted-foreground { color: var(--oak-muted-foreground); }
      .border-muted-foreground { border-color: var(--oak-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--oak-muted-foreground); }
      .bg-border { background-color: var(--oak-border); }
      .text-border { color: var(--oak-border); }
      .border-border { border-color: var(--oak-border); }
      .ring-border { --tw-ring-color: var(--oak-border); }
      .bg-input { background-color: var(--oak-input); }
      .text-input { color: var(--oak-input); }
      .border-input { border-color: var(--oak-input); }
      .ring-input { --tw-ring-color: var(--oak-input); }
      .bg-ring { background-color: var(--oak-ring); }
      .text-ring { color: var(--oak-ring); }
      .border-ring { border-color: var(--oak-ring); }
      .ring-ring { --tw-ring-color: var(--oak-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="flex min-h-screen flex-col lg:flex-row">
    <!-- Left: brand -->
    <section class="relative flex flex-1 items-center justify-center overflow-hidden bg-[var(--oak-surface-2)] px-8 py-12 lg:px-16">
      <div class="absolute inset-0 opacity-40">
        <div class="absolute -left-20 -top-20 h-80 w-80 rounded-full bg-[var(--oak-primary)]/20 blur-3xl"></div>
        <div class="absolute bottom-10 right-10 h-96 w-96 rounded-full bg-[var(--oak-primary)]/10 blur-3xl"></div>
      </div>
      <div class="relative z-10 w-full max-w-md">
        <a href="#" class="mb-10 inline-flex items-center gap-2 text-[var(--oak-ink)] font-semibold text-xl" data-dom-id="nav-index">
          <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-[var(--oak-primary)] text-[var(--oak-primary-foreground)]">
            <i data-lucide="layers" class="h-5 w-5"></i>
          </span>
          <span>Oak OA</span>
        </a>
        <h1 class="oak-h1 mb-4">欢迎回来</h1>
        <p class="oak-body-large mb-10">
          登录 Oak OA，体验 AI 助手与企业知识库驱动的现代办公方式。
        </p>
        <ul class="space-y-4">
          <li class="flex items-start gap-3">
            <span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[var(--oak-primary)]/10 text-[var(--oak-primary)]">
              <i data-lucide="check" class="h-4 w-4"></i>
            </span>
            <span class="oak-body">统一待办审批与流程追踪</span>
          </li>
          <li class="flex items-start gap-3">
            <span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[var(--oak-primary)]/10 text-[var(--oak-primary)]">
              <i data-lucide="check" class="h-4 w-4"></i>
            </span>
            <span class="oak-body">AI 智能问答与知识库检索</span>
          </li>
          <li class="flex items-start gap-3">
            <span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[var(--oak-primary)]/10 text-[var(--oak-primary)]">
              <i data-lucide="check" class="h-4 w-4"></i>
            </span>
            <span class="oak-body">多端数据实时同步与权限管理</span>
          </li>
        </ul>
      </div>
    </section>

    <!-- Right: form -->
    <section class="flex flex-1 items-center justify-center px-6 py-12 lg:px-16 bg-[var(--oak-background)]">
      <div class="w-full max-w-md">
        <div class="mb-8 lg:hidden">
          <a href="#" class="inline-flex items-center gap-2 text-[var(--oak-ink)] font-semibold text-xl" data-dom-id="nav-index">
            <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-[var(--oak-primary)] text-[var(--oak-primary-foreground)]">
              <i data-lucide="layers" class="h-5 w-5"></i>
            </span>
            <span>Oak OA</span>
          </a>
        </div>
        <div class="rounded-[var(--oak-radius-large)] border border-[var(--oak-line)] bg-[var(--oak-card)] p-8 shadow-[var(--oak-shadow-2)]">
          <div class="mb-6">
            <h2 class="oak-h2 mb-1">登录账户</h2>
            <p class="oak-body">输入邮箱和密码，继续使用系统。</p>
          </div>
          <form class="space-y-5" onsubmit="event.preventDefault();">
            <div>
              <label for="email" class="mb-1.5 block text-sm font-medium text-[var(--oak-ink)]">邮箱 / 工号</label>
              <div class="relative">
                <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--oak-ink-3)]">
                  <i data-lucide="mail" class="h-4 w-4"></i>
                </span>
                <input id="email" type="text" placeholder="name@company.com" class="w-full rounded-md border border-[var(--oak-input)] bg-[var(--oak-surface)] py-2.5 pl-9 pr-3 text-sm text-[var(--oak-ink)] outline-none placeholder:text-[var(--oak-ink-3)] focus:border-[var(--oak-ring)] focus:ring-2 focus:ring-[var(--oak-ring)]/20">
              </div>
            </div>
            <div>
              <label for="password" class="mb-1.5 block text-sm font-medium text-[var(--oak-ink)]">密码</label>
              <div class="relative">
                <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--oak-ink-3)]">
                  <i data-lucide="lock" class="h-4 w-4"></i>
                </span>
                <input id="password" type="password" placeholder="输入登录密码" class="w-full rounded-md border border-[var(--oak-input)] bg-[var(--oak-surface)] py-2.5 pl-9 pr-3 text-sm text-[var(--oak-ink)] outline-none placeholder:text-[var(--oak-ink-3)] focus:border-[var(--oak-ring)] focus:ring-2 focus:ring-[var(--oak-ring)]/20">
              </div>
            </div>
            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="h-4 w-4 rounded border-[var(--oak-input)] text-[var(--oak-primary)] focus:ring-[var(--oak-ring)]/20">
                <span class="text-sm text-[var(--oak-ink-2)]">记住我</span>
              </label>
              <a href="#" class="text-sm font-medium text-[var(--oak-primary)] hover:underline">忘记密码？</a>
            </div>
            <button type="submit" class="inline-flex w-full items-center justify-center rounded-md bg-[var(--oak-primary)] px-4 py-2.5 text-sm font-semibold text-[var(--oak-primary-foreground)] hover:brightness-105 focus:outline-none focus:ring-2 focus:ring-[var(--oak-ring)]/30" data-dom-id="nav-user-home">
              登录
            </button>
          </form>

          <div class="my-6 flex items-center gap-3">
            <div class="h-px flex-1 bg-[var(--oak-line)]"></div>
            <span class="oak-caption">或</span>
            <div class="h-px flex-1 bg-[var(--oak-line)]"></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button class="inline-flex items-center justify-center gap-2 rounded-md border border-[var(--oak-line)] bg-[var(--oak-surface)] px-3 py-2 text-sm font-medium text-[var(--oak-ink-2)] hover:bg-[var(--oak-muted)]">
              <i data-lucide="building-2" class="h-4 w-4"></i>
              企业微信
            </button>
            <button class="inline-flex items-center justify-center gap-2 rounded-md border border-[var(--oak-line)] bg-[var(--oak-surface)] px-3 py-2 text-sm font-medium text-[var(--oak-ink-2)] hover:bg-[var(--oak-muted)]">
              <i data-lucide="smartphone" class="h-4 w-4"></i>
              手机号
            </button>
          </div>
        </div>

        <p class="mt-6 text-center oak-body">
          还没有账户？
          <a href="#" class="font-medium text-[var(--oak-primary)] hover:underline">联系管理员开通</a>
        </p>

        <div class="mt-8 text-center lg:hidden">
          <a href="#" class="inline-flex items-center gap-1.5 text-sm font-medium text-[var(--oak-ink-2)] hover:text-[var(--oak-primary)]" data-dom-id="nav-index">
            <i data-lucide="arrow-left" class="h-4 w-4"></i>
            返回首页
          </a>
        </div>
      </div>
    </section>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
