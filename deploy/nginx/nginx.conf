# OA 办公知识库 - 统一网关 Nginx 配置
# 职责：动静分离（静态由 frontend 容器托管、动态 /api 反代后端）、Gzip 压缩、
#       SSE 流式透传、内网健康检查端点

upstream oa_backend {
  # 后端 NestJS 容器（docker-compose 网络内服务名解析）
  server backend:3000;
  keepalive 32;
}

upstream oa_frontend {
  # 前端静态容器（用户端 + 管理端 SPA）
  server frontend:80;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # Gzip 压缩 - 对文本类响应压缩，显著降低内网/公网带宽占用
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/woff2;

  # 客户端上传体大小（知识库文档/附件）
  client_max_body_size 20m;

  # ===== 健康检查端点（自愈机制探针）=====
  # 直接由网关返回 200，后端独立健康检查见 backend 容器 healthcheck
  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  # ===== API 动态接口反代后端 NestJS =====
  location /api/ {
    proxy_pass http://oa_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 连接与读取超时（默认业务）
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # ===== SSE 流式接口（AI 对话 /ai/chat/stream）=====
  # 关闭缓冲、关闭 gzip、延长读超时，保证 token 实时推送到前端打字机
  location ~* /api/ai/chat/stream {
    proxy_pass http://oa_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE 关键：禁用缓冲与压缩
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # 流式对话可能较长，放宽读超时
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ===== 静态前端（动静分离中的"动"侧路由，由 frontend 容器托管 SPA）=====
  location / {
    proxy_pass http://oa_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
